services:
  - type: web
    name: pulseboard-test
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Staging
      - key: Supabase__Url
        sync: false
      - key: Supabase__AnonKey
        sync: false
      - key: Supabase__ServiceRoleKey
        sync: false
